name: companion

services:
  frontend:
    build:
      context: .
      dockerfile: src/Companion.Frontend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceAuth__PrivateKey: ${SERVICE_TOKEN_PRIVATE_KEY:?Run dotnet tools/generate-service-keys.cs}
      Backend__BaseUrl: http://backend:8080
      OpenTelemetry__OtlpEndpoint: http://otel-lgtm:4317
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: src/Companion.Backend.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceAuth__CurrentPublicKey: ${SERVICE_TOKEN_PUBLIC_KEY:?Run dotnet tools/generate-service-keys.cs}
      ServiceAuth__PreviousPublicKey: ${SERVICE_TOKEN_PREVIOUS_PUBLIC_KEY:-}
    networks:
      - internal
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  public:
  internal:
    internal: true
