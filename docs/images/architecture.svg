  <text x="160" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">User device</text>
  <text x="160" y="64" text-anchor="middle" font-size="12" fill="#185FA5">Web browser (phone or desktop)</text>

  <rect x="40" y="96" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="160" y="121" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">WebAssembly client</text>
  <text x="160" y="142" text-anchor="middle" font-size="12" fill="#185FA5">Blazor WebAssembly, Tailwind CSS</text>

  <rect x="40" y="226" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="160" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Browser storage</text>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#185FA5">Local user data</text>

  <rect x="40" y="356" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="160" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Local files</text>
  <text x="160" y="402" text-anchor="middle" font-size="12" fill="#185FA5">Export / import (JSON)</text>

  <line x1="160" y1="162" x2="160" y2="224" stroke="#5F5E5A" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M38 128 L29 128 L29 388 L38 388" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Server side boundary -->
  <rect x="340" y="20" width="600" height="440" rx="16" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="358" y="42" font-size="13" font-weight="600" fill="#444441">Server side</text>

  <!-- Frontend -->
  <rect x="355" y="54" width="260" height="286" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="485" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Frontend (public)</text>
  <text x="485" y="96" text-anchor="middle" font-size="12" fill="#534AB7">ASP.NET Core – Blazor Web App</text>

  <rect x="373" y="112" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="485" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Server rendering</text>
  <text x="485" y="155" text-anchor="middle" font-size="12" fill="#534AB7">Blazor static SSR</text>

  <rect x="373" y="186" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="485" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">BFF endpoints</text>
  <text x="485" y="229" text-anchor="middle" font-size="12" fill="#534AB7">Forward calls to backend</text>

  <rect x="373" y="260" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="485" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">User session</text>
  <text x="485" y="303" text-anchor="middle" font-size="12" fill="#534AB7">Cookie, OAuth sign-in</text>

