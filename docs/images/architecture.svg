<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Universal Companion App – architecture</title>
  <desc>Infrastructure view. The browser runs the Blazor WebAssembly client with browser storage and local files and talks only to the public frontend over HTTPS with the user session. The frontend (Backend-for-Frontend) calls the private backend API with a service token. Only the backend uses PostgreSQL and the SMTP email service. Both services send telemetry (OTLP) to an OpenTelemetry Collector on the private network; only the Collector talks to Grafana. An offline pipeline turns external data into versioned seed data, which the backend loads into memory on startup. PostgreSQL arrives in Phase 5 for progress and identity data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="690" fill="#FFFFFF"/>

  <!-- User device -->
