  <text x="595" y="578" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Seed builder</text>
  <text x="595" y="598" text-anchor="middle" font-size="12" fill="#0F6E56">Transform and validate</text>

  <rect x="730" y="554" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="825" y="578" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Seed data</text>
  <text x="825" y="598" text-anchor="middle" font-size="12" fill="#0F6E56">Versioned JSON in git</text>

  <line x1="230" y1="584" x2="268" y2="584" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="584" x2="498" y2="584" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="690" y1="584" x2="728" y2="584" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <path d="M825 554 L825 486 L786 486 L786 320" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <text x="796" y="480" font-size="11" fill="#0F6E56">loaded into memory on startup</text>

  <!-- Legend -->
  <rect x="30" y="660" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="50" y="672" font-size="12" fill="#444441">User device</text>
  <rect x="140" y="660" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="160" y="672" font-size="12" fill="#444441">Frontend (public)</text>
  <rect x="285" y="660" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="305" y="672" font-size="12" fill="#444441">Backend (private)</text>
  <rect x="430" y="660" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="450" y="672" font-size="12" fill="#444441">Infrastructure services</text>
  <rect x="610" y="660" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="630" y="672" font-size="12" fill="#444441">Offline data pipeline</text>
  <rect x="790" y="660" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="3 2"/>
  <text x="810" y="672" font-size="12" fill="#444441">Dashed = later phase</text>
</svg>
