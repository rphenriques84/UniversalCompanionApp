version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nuget-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /src/Companion.Frontend
      - /src/Companion.Backend.Api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-compose-minor-and-patch:
        update-types:
          - minor
          - patch
