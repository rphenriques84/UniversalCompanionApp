  <rect x="655" y="54" width="270" height="286" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="790" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Backend API (private)</text>
  <text x="790" y="96" text-anchor="middle" font-size="12" fill="#993C1D">ASP.NET Core – Minimal APIs</text>

  <rect x="673" y="112" width="234" height="58" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="790" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Web API</text>
  <text x="790" y="155" text-anchor="middle" font-size="12" fill="#993C1D">Service-token protected</text>

  <rect x="673" y="186" width="234" height="58" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="790" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Domain layer</text>
  <text x="790" y="229" text-anchor="middle" font-size="12" fill="#993C1D">Shared .NET library</text>

  <rect x="673" y="260" width="234" height="58" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="790" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Data access</text>
  <text x="790" y="303" text-anchor="middle" font-size="12" fill="#993C1D">Game data loader; EF Core later</text>

  <!-- Device -> Frontend -->
  <line x1="282" y1="128" x2="371" y2="128" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="303" y="120" font-size="10" letter-spacing="-0.2" fill="#5F5E5A">HTTPS</text>

  <!-- Frontend -> Backend -->
  <line x1="617" y1="197" x2="653" y2="197" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="635" y="189" text-anchor="middle" font-size="10" fill="#5F5E5A">JWT</text>

  <!-- Infrastructure row -->
  <rect x="355" y="380" width="127" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="418.5" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">OTel Collector</text>
  <text x="418.5" y="424" text-anchor="middle" font-size="12" fill="#5F5E5A">Telemetry gateway</text>
  <rect x="502" y="380" width="127" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="565.5" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Grafana</text>
  <text x="565.5" y="424" text-anchor="middle" font-size="12" fill="#5F5E5A">Observability</text>
  <rect x="649" y="380" width="127" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="712.5" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">PostgreSQL</text>
  <text x="712.5" y="424" text-anchor="middle" font-size="12" fill="#5F5E5A">Progress, identity</text>
  <rect x="796" y="380" width="127" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="859.5" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Email service</text>
  <text x="859.5" y="424" text-anchor="middle" font-size="12" fill="#5F5E5A">SMTP</text>

  <line x1="418" y1="340" x2="418" y2="378" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="426" y="364" font-size="10" fill="#5F5E5A">OTLP</text>
  <path d="M668 340 L668 358 L462 358 L462 378" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="565" y="352" text-anchor="middle" font-size="10" fill="#5F5E5A">OTLP</text>
  <line x1="482" y1="410" x2="500" y2="410" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="712" y1="340" x2="712" y2="378" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="860" y1="340" x2="860" y2="378" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="868" y="364" font-size="10" fill="#5F5E5A">SMTP</text>

  <!-- Pipeline -->
  <rect x="20" y="510" width="920" height="130" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="40" y="534" font-size="13" font-weight="600" fill="#085041">Offline data pipeline (development only)</text>

