<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>Universal Companion App: current architecture</title>
  <desc>What exists today. A web browser loads pages from the frontend over HTTP. The frontend, backend and observability stack run in Docker Compose. The backend has no endpoints and no published port. No service sends telemetry yet. A developer can open Grafana from the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#FFFFFF"/>

  <!-- User device -->
  <rect x="20" y="20" width="250" height="390" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="145" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#0C447C">User device</text>
  <rect x="40" y="110" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="145" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Web browser</text>
  <text x="145" y="165" text-anchor="middle" font-size="12" fill="#185FA5">Phone or desktop</text>

  <!-- Docker Compose -->
  <rect x="330" y="20" width="610" height="390" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="350" y="46" font-size="14" font-weight="600" fill="#444441">Docker Compose (local)</text>

  <!-- Frontend -->
  <rect x="350" y="60" width="275" height="205" rx="12" fill="#EEEDFC" stroke="#534AB7" stroke-width="1"/>
  <text x="487.5" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Frontend (public)</text>
  <text x="487.5" y="103" text-anchor="middle" font-size="12" fill="#534AB7">ASP.NET Core, Blazor Web App</text>
  <rect x="368" y="118" width="239" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="487.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Server rendering</text>
  <text x="487.5" y="161" text-anchor="middle" font-size="12" fill="#534AB7">Blazor static SSR</text>
  <rect x="368" y="190" width="239" height="58" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <text x="487.5" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">WebAssembly client</text>
  <text x="487.5" y="233" text-anchor="middle" font-size="12" fill="#534AB7">Files served, no interactive pages yet</text>

  <!-- Backend -->
  <rect x="645" y="60" width="275" height="205" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="782.5" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Backend API (private)</text>
  <text x="782.5" y="103" text-anchor="middle" font-size="12" fill="#993C1D">ASP.NET Core, no published port</text>
  <rect x="663" y="118" width="239" height="58" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="782.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Web API</text>
  <text x="782.5" y="161" text-anchor="middle" font-size="12" fill="#993C1D">No endpoints yet</text>
  <rect x="663" y="190" width="239" height="58" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="782.5" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Libraries</text>
  <text x="782.5" y="233" text-anchor="middle" font-size="12" fill="#993C1D">Domain, Contracts, Data (all empty)</text>

  <!-- Observability -->
  <rect x="350" y="280" width="570" height="100" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="635" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Observability (otel-lgtm container, no telemetry sent yet)</text>
  <rect x="368" y="312" width="239" height="54" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="487.5" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">OTel Collector</text>
  <text x="487.5" y="353" text-anchor="middle" font-size="12" fill="#5F5E5A">Telemetry gateway</text>
  <rect x="663" y="312" width="239" height="54" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="782.5" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Grafana</text>
  <text x="782.5" y="353" text-anchor="middle" font-size="12" fill="#5F5E5A">Dashboards</text>

  <!-- Connections that exist -->
  <line x1="250" y1="147" x2="366" y2="147" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="139" text-anchor="middle" font-size="11" fill="#5F5E5A">HTTP :8080</text>
  <line x1="607" y1="339" x2="661" y2="339" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M145 190 L145 395 L782 395 L782 368" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="345" y="391" font-size="11" fill="#5F5E5A">HTTP :3000, developer only</text>

  <!-- Legend -->
  <rect x="20" y="436" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="40" y="448" font-size="12" fill="#444441">User device</text>
  <rect x="140" y="436" width="14" height="14" rx="3" fill="#EEEDFC" stroke="#534AB7"/>
  <text x="160" y="448" font-size="12" fill="#444441">Frontend</text>
  <rect x="240" y="436" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="260" y="448" font-size="12" fill="#444441">Backend</text>
  <rect x="340" y="436" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="360" y="448" font-size="12" fill="#444441">Infrastructure</text>
  <text x="940" y="448" text-anchor="end" font-size="12" fill="#444441">Current state only. Plan tasks marked "Diagram:" add the rest.</text>
</svg>
